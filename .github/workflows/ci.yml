name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # test:baseline reads the original commit 2518abd
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:baseline
      - run: npm run build:demo
      - run: npm run build:remote
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Look baseline (release R3.1): screenshots of every existing screen compared
  # with the reference pictures in e2e/visual.spec.ts-snapshots/. The pinned
  # Playwright image keeps fonts and rendering identical between runs. On a
  # difference, or a missing reference, the job fails and uploads the new
  # pictures and the differences for review (docs/development.md).
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Exact comparison. Text anti-aliasing occasionally jitters on one picture
      # (about 2 of 80 tests per run, never the same one twice), so a failed test
      # is retried twice; a real change fails all three attempts.
      - run: npx playwright test --project=visual-desktop --project=visual-mobile --retries=2
        env:
          CI: "true"
          E2E_VISUAL: "1"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-differences
          path: |
            test-results/
            e2e/visual.spec.ts-snapshots/
          retention-days: 7

  deploy-config:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Build the backend image
        run: docker build -t magistri-api:ci backend
      - name: Image runs as non-root with the pinned versions
        run: |
          test "$(docker run --rm magistri-api:ci id -u)" = "10001"
          docker run --rm magistri-api:ci python -c "import django, gunicorn, psycopg, PIL; print('django', django.get_version(), 'gunicorn', gunicorn.__version__)"
      - name: Compose file is valid (with the staging profile)
        run: SITE_ADDRESS=:80 docker compose -f deploy/compose.yaml --profile staging-backend config --quiet
      - name: Deploy scripts parse
        run: |
          for script in deploy/*.sh; do bash -n "$script"; done
          python3 -m py_compile deploy/b2_upload.py
      - name: Caddyfile is valid
        run: |
          docker run --rm -v "$PWD/deploy/caddy:/etc/caddy:ro" -e SITE_ADDRESS=:80 -e STAGING_ADDRESS=http://staging.invalid \
            caddy:2.10.2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: magistri_dev
          POSTGRES_USER: magistri
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U magistri -d magistri_dev"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      POSTGRES_DB: magistri_dev
      POSTGRES_USER: magistri
      POSTGRES_PASSWORD: ci-only-not-a-secret
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python manage.py check --settings=config.test_settings
      - run: python manage.py makemigrations --check --dry-run --settings=config.test_settings
      - run: python manage.py export_api_contract --check --settings=config.test_settings
      - run: python manage.py test domain.tests --settings=config.test_settings --noinput
