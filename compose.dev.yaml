# Local PostgreSQL only; not production/VPS deployment configuration.
name: magistri-development
services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-magistri_dev}
      POSTGRES_USER: ${POSTGRES_USER:-magistri}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - magistri_dev_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  magistri_dev_postgres:
