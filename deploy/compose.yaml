# Production web stack, release R1: Caddy serving the static frontend with
# automatic HTTPS. R2 adds the Django and PostgreSQL services.
# Run from the repository root:  docker compose -f deploy/compose.yaml up -d
name: magistri
services:
  web:
    image: caddy:2.10.2
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./releases:/srv/releases:ro
      - caddy_data:/data
      - caddy_config:/config
    labels:
      # Opt out of container auto-updaters such as Watchtower; image
      # versions change only through a reviewed commit.
      com.centurylinklabs.watchtower.enable: "false"
volumes:
  caddy_data:
  caddy_config:
