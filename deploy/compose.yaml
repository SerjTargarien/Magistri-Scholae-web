# Server stack. Run from the repository root:
#   docker compose -f deploy/compose.yaml up -d
# Release R1: Caddy serves the public site with automatic HTTPS.
# Release R2: the staging backend (Django + PostgreSQL) runs only when the
# "staging-backend" profile is enabled (COMPOSE_PROFILES in deploy/.env).
# Release R6: the testers' production backend, with its own database, media and
# secrets, runs with the "production-backend" profile. Both backends build from
# this checkout: rebuild production only at a milestone (deploy/README.md).
name: magistri

networks:
  # Caddy and the backends. Fixed subnet so Django can trust exactly this
  # network for X-Forwarded-* headers (DJANGO_TRUSTED_PROXIES).
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  # Staging database network: no internet access, only the staging backend.
  staging-db:
    internal: true
  # Production database network: no internet access, only the production backend.
  production-db:
    internal: true

services:
  web:
    image: caddy:2.10.2
    restart: unless-stopped
    ports:
      # BIND_ADDRESS=127.0.0.1 keeps a local test off the network.
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in deploy/.env}
      # Placeholder that never resolves and needs no certificate.
      STAGING_ADDRESS: ${STAGING_ADDRESS:-http://staging.invalid}
    volumes:
      # A directory mount survives git replacing the Caddyfile on pull.
      - ./caddy:/etc/caddy:ro
      - ./releases:/srv/releases:ro
      - ./releases-staging:/srv/releases-staging:ro
      # Other websites on this server, kept outside this repository: one
      # folder per site with its own Caddyfile (deploy/README.md section 8).
      - ${SITES_DIR:-/opt/sites}:/srv/sites:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    labels:
      # Opt out of container auto-updaters such as Watchtower; image
      # versions change only through a reviewed commit.
      com.centurylinklabs.watchtower.enable: "false"

  db-staging:
    profiles: ["staging-backend"]
    image: postgres:18.6
    restart: unless-stopped
    # POSTGRES_DB, POSTGRES_USER and POSTGRES_PASSWORD (server-only file).
    env_file:
      - path: .env.staging
        required: false
    volumes:
      - pg_staging:/var/lib/postgresql
    networks: [staging-db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    labels:
      com.centurylinklabs.watchtower.enable: "false"

  api-staging:
    profiles: ["staging-backend"]
    build: ../backend
    image: magistri-api:staging
    restart: unless-stopped
    # Django keys, allowed hosts and the database credentials (server-only file).
    env_file:
      - path: .env.staging
        required: false
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_TRUSTED_PROXIES: 172.30.0.0/24
      MAGISTRI_ENVIRONMENT: staging
      POSTGRES_HOST: db-staging
      POSTGRES_PORT: "5432"
    volumes:
      - media_staging:/data/media
    networks: [edge, staging-db]
    depends_on:
      db-staging:
        condition: service_healthy
    labels:
      com.centurylinklabs.watchtower.enable: "false"

  db-production:
    profiles: ["production-backend"]
    image: postgres:18.6
    restart: unless-stopped
    # POSTGRES_DB, POSTGRES_USER and POSTGRES_PASSWORD (server-only file).
    env_file:
      - path: .env.production
        required: false
    volumes:
      - pg_production:/var/lib/postgresql
    networks: [production-db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    labels:
      com.centurylinklabs.watchtower.enable: "false"

  api-production:
    profiles: ["production-backend"]
    build: ../backend
    image: magistri-api:production
    restart: unless-stopped
    # Django keys, allowed hosts and the database credentials (server-only file).
    env_file:
      - path: .env.production
        required: false
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_TRUSTED_PROXIES: 172.30.0.0/24
      MAGISTRI_ENVIRONMENT: production
      POSTGRES_HOST: db-production
      POSTGRES_PORT: "5432"
    volumes:
      - media_production:/data/media
    networks: [edge, production-db]
    depends_on:
      db-production:
        condition: service_healthy
    labels:
      com.centurylinklabs.watchtower.enable: "false"

volumes:
  caddy_data:
  caddy_config:
  pg_staging:
  media_staging:
  pg_production:
  media_production:
